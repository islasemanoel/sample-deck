name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    # O app é para Windows (caminhos, arrasto de arquivos, ícone .ico): testa no mesmo sistema
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
